<div class="jeu-card" [attr.data-index]="colorIndex() % 6">
    <div class="jeu-card__visual">
        <span class="jeu-card__game-name">{{ jeu().nom }}</span>
    </div>
    <div class="jeu-card__info">
        @if (jeu().description) {
        <p class="jeu-card__description">{{ jeu().description }}</p>
        }
        <p class="jeu-card__meta">
            {{ jeu().nbNumerosATirer }} numéros sur {{ jeu().intervalNumero }}
            @if (jeu().nbNumeroChanceATirer) {
            · {{ jeu().nbNumeroChanceATirer }} numéro chance sur {{ jeu().intervalNumeroChance }}
            }
        </p>
    </div>
</div>
