<!-- src/app/core/layout/header/header.component.html -->
<header class="header">
  <div class="container">
    <!-- Logo -->
    <div class="logo">
      <a routerLink="/">
        <img src="/logo.png" alt="Lotofolio" class="logo-img" />
        Lotofolio
      </a>
    </div>

    <!-- Navigation desktop -->
    <nav class="nav">
      <!-- Liens publics -->
      <a routerLink="/jeux" routerLinkActive="active">
        Jeux
      </a>

      <!-- Liens authentifiés -->
      @if (authService.isLoggedIn()) {
        <a routerLink="/historique" routerLinkActive="active">
          Mon historique
        </a>
      }
    </nav>

    <!-- User menu -->
    <div class="user-menu">
      @if (authService.isLoggedIn()) {
        <div class="user-info">
          <span class="username">
            👤 {{ authService.user()?.name }}
          </span>
          <button class="btn-logout" (click)="logout()">
            Déconnexion
          </button>
        </div>
      } @else {
        <div class="auth-buttons">
          <a routerLink="/login" class="btn btn-outline">
            Connexion
          </a>
          <a routerLink="/register" class="btn btn-primary">
            Inscription
          </a>
        </div>
      }
    </div>

    <!-- Hamburger (mobile) -->
    <button
      class="hamburger"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Ouvrir le menu"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <!-- Navigation mobile (dropdown) -->
  @if (menuOpen()) {
    <nav class="mobile-nav" (click)="closeMenu()">
      <a routerLink="/jeux" routerLinkActive="active">Jeux</a>
      @if (authService.isLoggedIn()) {
        <a routerLink="/historique" routerLinkActive="active">Mon historique</a>
      }
    </nav>
  }
</header>
