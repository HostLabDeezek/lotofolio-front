<header class="header">
  <div class="container">
    <!-- Hamburger (visible uniquement en mobile via CSS) -->
    <button class="hamburger" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Logo -->
    <div class="logo">
      <a routerLink="/">
        <img src="/logo.png" alt="Lotofolio" class="logo-img" />
        Lotofolio
      </a>
    </div>

    <!-- Navigation desktop -->
    <nav class="nav">
      <a routerLink="/jeux" routerLinkActive="active">Jeux</a>
      <a routerLink="/tirages" routerLinkActive="active">Tirages</a>
      @if (authService.isLoggedIn()) {
        <a routerLink="/grilles" routerLinkActive="active">Mes Grilles</a>
        <a routerLink="/resultats" routerLinkActive="active">Résultats</a>
      }
    </nav>

    <!-- User menu -->
    <div class="user-menu">
      @if (authService.isLoggedIn()) {
        <div class="user-info">
          <span class="username">👤 {{ authService.user()?.name }}</span>
          <button class="btn-logout" (click)="logout()">Déconnexion</button>
        </div>
      } @else {
        <div class="auth-buttons">
          <a routerLink="/login" class="btn btn-outline">Connexion</a>
          <a routerLink="/register" class="btn btn-primary">Inscription</a>
        </div>
      }
    </div>
  </div>

  <!-- Navigation mobile (dropdown) -->
  @if (menuOpen()) {
    <nav class="mobile-nav">
      <a routerLink="/jeux" routerLinkActive="active" (click)="closeMenu()">Jeux</a>
      <a routerLink="/tirages" routerLinkActive="active" (click)="closeMenu()">Tirages</a>
      @if (authService.isLoggedIn()) {
        <a routerLink="/grilles" routerLinkActive="active" (click)="closeMenu()">Mes Grilles</a>
        <a routerLink="/resultats" routerLinkActive="active" (click)="closeMenu()">Résultats</a>
      }
    </nav>
  }
</header>
