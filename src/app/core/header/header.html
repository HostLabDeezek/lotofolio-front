<header class="header">
  <div class="container">
    <!-- Logo -->
    <div class="logo">
      <a routerLink="/">
        <img src="/logo.png" alt="Lotofolio" class="logo-img" />
        Lotofolio
      </a>
    </div>

    <!-- Navigation desktop -->
    <nav class="nav">
      <a routerLink="/jeux" routerLinkActive="active">Jeux</a>
      @if (authService.isLoggedIn()) {
        <a routerLink="/historique" routerLinkActive="active">Mon historique</a>
      }
    </nav>

    <!-- User menu -->
    <div class="user-menu">
      @if (authService.isLoggedIn()) {
        <div class="user-dropdown">
          <button
            class="avatar"
            (click)="toggleDropdown()"
            [attr.aria-expanded]="dropdownOpen()"
            aria-haspopup="menu"
            aria-label="Menu utilisateur"
          >
            {{ userInitials() }}
          </button>
          @if (dropdownOpen()) {
            <div class="dropdown-menu" role="menu">
              <a class="dropdown-item" role="menuitem" routerLink="/parametres" (click)="dropdownOpen.set(false)">
                Paramètres
              </a>
              <hr class="dropdown-divider" />
              <button class="dropdown-item dropdown-item--danger" role="menuitem" (click)="logout()">
                Se déconnecter
              </button>
            </div>
          }
        </div>
      } @else {
        <div class="auth-buttons">
          <a routerLink="/login" class="btn btn-outline">Connexion</a>
          <a routerLink="/register" class="btn btn-primary">Inscription</a>
        </div>
      }
    </div>

    <!-- Hamburger (mobile) -->
    <button
      class="hamburger"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="menuOpen() ? 'Fermer le menu' : 'Ouvrir le menu'"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <!-- Navigation mobile -->
  @if (menuOpen()) {
    <nav class="mobile-nav">
      <a routerLink="/jeux" routerLinkActive="active" (click)="closeMenu()">Jeux</a>
      @if (authService.isLoggedIn()) {
        <a routerLink="/historique" routerLinkActive="active" (click)="closeMenu()">Mon historique</a>
        <button class="mobile-logout" (click)="logout()">Se déconnecter</button>
      }
    </nav>
  }
</header>
