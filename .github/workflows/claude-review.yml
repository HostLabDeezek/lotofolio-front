# ============================================================
# Claude Code Review — GitHub Actions Workflow
# ============================================================
# Ce workflow se déclenche automatiquement quand une PR est
# ouverte ou mise à jour. Claude analyse le diff, vérifie
# la qualité du code et poste un commentaire détaillé.
# ============================================================

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Git Flow : on review toutes les PR vers develop et main
    branches:
      - develop
      - main

# Empêche les reviews en doublon si on push vite plusieurs fois
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ---- 1. Checkout du code ----
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Historique complet pour comparer les branches

      # ---- 2. Charger la config du projet ----
      - name: Load project config
        id: config
        run: |
          CONFIG_FILE=".claude-review.yml"
          if [ -f "$CONFIG_FILE" ]; then
            echo "config_found=true" >> $GITHUB_OUTPUT
            echo "language=$(yq e '.language' "$CONFIG_FILE")" >> $GITHUB_OUTPUT
            echo "version=$(yq e '.version' "$CONFIG_FILE")" >> $GITHUB_OUTPUT
            echo "framework=$(yq e '.framework' "$CONFIG_FILE")" >> $GITHUB_OUTPUT
            echo "style_guide=$(yq e '.style_guide' "$CONFIG_FILE")" >> $GITHUB_OUTPUT
            echo "review_depth=$(yq e '.review_depth' "$CONFIG_FILE")" >> $GITHUB_OUTPUT
            CLAUDE_MODEL=$(yq e '.claude_model // "claude-sonnet-4-6"' "$CONFIG_FILE")
            echo "claude_model=$CLAUDE_MODEL" >> $GITHUB_OUTPUT
          else
            echo "config_found=false" >> $GITHUB_OUTPUT
            echo "language=unknown" >> $GITHUB_OUTPUT
            echo "version=latest" >> $GITHUB_OUTPUT
            echo "framework=none" >> $GITHUB_OUTPUT
            echo "style_guide=standard" >> $GITHUB_OUTPUT
            echo "review_depth=detailed" >> $GITHUB_OUTPUT
            echo "claude_model=claude-sonnet-4-6" >> $GITHUB_OUTPUT
          fi

      # ---- 3. Détecter le type de branche (Git Flow) ----
      - name: Detect branch type
        id: branch
        shell: bash
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          TARGET_BRANCH="${{ github.base_ref }}"

          if [[ "$BRANCH_NAME" == feature/* ]]; then
            BRANCH_TYPE="feature"
            REVIEW_FOCUS="Nouvelle fonctionnalité — review complète : architecture, qualité, tests, conventions."
          elif [[ "$BRANCH_NAME" == fix/* || "$BRANCH_NAME" == bugfix/* ]]; then
            BRANCH_TYPE="fix"
            REVIEW_FOCUS="Correction de bug — vérifier que le fix est ciblé, pas de régression, test du cas corrigé."
          elif [[ "$BRANCH_NAME" == hotfix/* ]]; then
            BRANCH_TYPE="hotfix"
            REVIEW_FOCUS="Hotfix production — review critique : impact minimal, pas d'effets de bord, rollback possible."
          elif [[ "$BRANCH_NAME" == release/* ]]; then
            BRANCH_TYPE="release"
            REVIEW_FOCUS="Release — vérifier la stabilité : pas de TODO, pas de console.log, versions à jour, changelog."
          elif [[ "$BRANCH_NAME" == refactor/* ]]; then
            BRANCH_TYPE="refactor"
            REVIEW_FOCUS="Refactoring — le comportement ne doit pas changer : même inputs/outputs, tests verts."
          elif [[ "$BRANCH_NAME" == chore/* ]]; then
            BRANCH_TYPE="chore"
            REVIEW_FOCUS="Tâche technique — vérifier la config, les dépendances, pas de breaking change."
          elif [[ "$BRANCH_NAME" == docs/* ]]; then
            BRANCH_TYPE="docs"
            REVIEW_FOCUS="Documentation — clarté, exactitude, orthographe, liens valides."
          else
            BRANCH_TYPE="other"
            REVIEW_FOCUS="Review standard — qualité générale du code."
          fi

          echo "type=$BRANCH_TYPE" >> $GITHUB_OUTPUT
          echo "name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "target=$TARGET_BRANCH" >> $GITHUB_OUTPUT
          echo "focus=$REVIEW_FOCUS" >> $GITHUB_OUTPUT

      # ---- 4. Récupérer le diff de la PR ----
      - name: Get PR diff
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Récupérer le diff avec gh CLI
          gh pr diff ${{ github.event.pull_request.number }} > /tmp/pr_diff_full.txt

          # Limiter la taille du diff pour ne pas dépasser les limites de l'API Claude
          head -c 80000 /tmp/pr_diff_full.txt > /tmp/pr_diff.txt

          # Vérifier si le diff a été tronqué
          DIFF_SIZE=$(wc -c < /tmp/pr_diff_full.txt)
          if [ "$DIFF_SIZE" -gt 80000 ]; then
            echo "" >> /tmp/pr_diff.txt
            echo "... [DIFF TRONQUÉ — trop volumineux pour une review complète. Concentre-toi sur les fichiers les plus critiques.]" >> /tmp/pr_diff.txt
          fi

          # Récupérer les stats via gh CLI
          PR_STATS=$(gh pr view ${{ github.event.pull_request.number }} --json additions,deletions,changedFiles)

          FILES_CHANGED=$(echo "$PR_STATS" | jq -r '.changedFiles')
          ADDITIONS=$(echo "$PR_STATS" | jq -r '.additions')
          DELETIONS=$(echo "$PR_STATS" | jq -r '.deletions')

          echo "files_changed=$FILES_CHANGED" >> $GITHUB_OUTPUT
          echo "additions=$ADDITIONS" >> $GITHUB_OUTPUT
          echo "deletions=$DELETIONS" >> $GITHUB_OUTPUT

      # ---- 5. Charger les instructions de review custom (si elles existent) ----
      - name: Load custom review instructions
        id: custom
        run: |
          CUSTOM_FILE=".claude-review-prompt.md"
          if [ -f "$CUSTOM_FILE" ]; then
            CUSTOM_INSTRUCTIONS=$(cat "$CUSTOM_FILE" | head -c 5000)
            echo "has_custom=true" >> $GITHUB_OUTPUT
          else
            CUSTOM_INSTRUCTIONS=""
            echo "has_custom=false" >> $GITHUB_OUTPUT
          fi
          # Sauvegarder dans un fichier
          echo "$CUSTOM_INSTRUCTIONS" > /tmp/custom_instructions.txt

      # ---- 6. Construire le prompt et appeler Claude ----
      - name: Call Claude API for review
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANGUAGE: ${{ steps.config.outputs.language }}
          VERSION: ${{ steps.config.outputs.version }}
          FRAMEWORK: ${{ steps.config.outputs.framework }}
          STYLE_GUIDE: ${{ steps.config.outputs.style_guide }}
          REVIEW_DEPTH: ${{ steps.config.outputs.review_depth }}
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
          BRANCH_TARGET: ${{ steps.branch.outputs.target }}
          BRANCH_TYPE: ${{ steps.branch.outputs.type }}
          BRANCH_FOCUS: ${{ steps.branch.outputs.focus }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          FILES_CHANGED: ${{ steps.diff.outputs.files_changed }}
          ADDITIONS: ${{ steps.diff.outputs.additions }}
          DELETIONS: ${{ steps.diff.outputs.deletions }}
          CLAUDE_MODEL: ${{ steps.config.outputs.claude_model }}
        run: |
          python3 << 'PYEOF'
          import json
          import os
          import pathlib
          import socket
          import sys
          import time
          import urllib.error
          import urllib.request

          MAX_DIFF_CHARS = 80_000
          MAX_RETRIES = 3
          RETRYABLE_STATUS = (429, 529)

          def set_output(key: str, value: str) -> None:
              """Écrit un output GitHub Actions (gère le format heredoc multiligne)."""
              path = os.environ.get("GITHUB_OUTPUT")
              if not path:
                  return
              with open(path, 'a', encoding='utf-8') as out:
                  if '\n' in value:
                      out.write(f"{key}<<EOF_OUTPUT\n{value}\nEOF_OUTPUT\n")
                  else:
                      out.write(f"{key}={value}\n")

          def write_comment(text: str) -> None:
              with open('/tmp/review_comment.txt', 'w', encoding='utf-8') as f:
                  f.write(text)

          def fail(msg: str, comment: str) -> None:
              print(msg)
              write_comment(comment)
              set_output("review_success", "false")
              sys.exit(0)  # exit 0 pour que l'étape 7 puisse poster le commentaire

          # Vérifier que les fichiers temporaires existent (sinon une étape précédente a échoué)
          for path_str in ('/tmp/pr_diff.txt', '/tmp/custom_instructions.txt'):
              if not pathlib.Path(path_str).exists():
                  fail(
                      f"❌ Fichier {path_str} introuvable — une étape précédente a-t-elle échoué ?",
                      f"⚠️ Fichier {path_str} manquant. Voir les logs du workflow.",
                  )

          with open('/tmp/pr_diff.txt', encoding='utf-8', errors='replace') as f:
              diff = f.read()
          with open('/tmp/custom_instructions.txt', encoding='utf-8', errors='replace') as f:
              custom = f.read()

          # Tronquer le diff pour ne pas dépasser la limite de tokens de l'API
          if len(diff) > MAX_DIFF_CHARS:
              original_size = len(diff)
              diff = diff[:MAX_DIFF_CHARS] + (
                  f"\n\n[... diff tronqué à {MAX_DIFF_CHARS} caractères "
                  f"(taille originale : {original_size}) — concentre-toi sur les fichiers les plus critiques.]"
              )
              print(f"⚠️ Diff tronqué ({original_size} > {MAX_DIFF_CHARS} chars)")

          env = os.environ
          prompt = f"""Tu es un expert en code review senior. Ton rôle est de relire cette Pull Request et de fournir un retour détaillé, pédagogique et bienveillant pour aider le développeur à progresser.

          ## Contexte du projet
          - **Langage** : {env['LANGUAGE']} (version {env['VERSION']})
          - **Framework** : {env['FRAMEWORK']}
          - **Style guide** : {env['STYLE_GUIDE']}
          - **Profondeur de review** : {env['REVIEW_DEPTH']}

          ## Contexte de la PR
          - **Branche** : {env['BRANCH_NAME']} → {env['BRANCH_TARGET']}
          - **Type** : {env['BRANCH_TYPE']}
          - **Focus** : {env['BRANCH_FOCUS']}
          - **Titre** : {env['PR_TITLE']}
          - **Description** : {env.get('PR_BODY', '') or '(aucune)'}
          - **Stats** : {env['FILES_CHANGED']} fichiers modifiés, +{env['ADDITIONS']} / -{env['DELETIONS']}

          ## Instructions custom du projet
          {custom}

          ## IMPORTANT — Règles de review
          1. Base ta review sur les bonnes pratiques de **{env['LANGUAGE']} {env['VERSION']}** spécifiquement
          2. Vérifie que les conventions de nommage du projet sont respectées
          3. Identifie les problèmes de sécurité, performance et maintenabilité
          4. Propose des alternatives concrètes avec des exemples de code quand tu suggères un changement
          5. Sois pédagogique : explique le "pourquoi" de chaque suggestion pour que le développeur apprenne
          6. Adapte le niveau de détail au type de branche ({env['BRANCH_TYPE']})

          ## Format de réponse attendu
          Structure ta review ainsi :

          ### 🎯 Résumé
          Un résumé en 2-3 phrases de ce que fait cette PR et ta première impression.

          ### ✅ Points positifs
          Ce qui est bien fait (toujours commencer par le positif).

          ### 🔴 Problèmes critiques
          Ce qui DOIT être corrigé avant merge (bugs, sécurité, breaking changes).
          Pour chaque problème, donne :
          - Le fichier et la ligne concernés
          - Pourquoi c'est un problème
          - Comment le corriger (avec exemple de code)

          ### 🟡 Suggestions d'amélioration
          Ce qui pourrait être mieux mais n'est pas bloquant.
          Pour chaque suggestion :
          - Ce que tu ferais différemment
          - Pourquoi c'est mieux (la leçon à retenir)

          ### 📚 Ce que tu peux apprendre de cette PR
          1-3 points pédagogiques tirés de cette review, avec des liens vers la documentation officielle si pertinent.

          ### 📊 Score global
          Note la PR sur ces critères (sur 5) :
          - Lisibilité
          - Maintenabilité
          - Sécurité
          - Performance
          - Respect des conventions

          ---

          ## Diff de la PR :
          ```diff
          {diff}
          ```
          """

          body = json.dumps({
              "model": env.get("CLAUDE_MODEL") or "claude-sonnet-4-6",
              "max_tokens": 4096,
              "messages": [{"role": "user", "content": prompt}],
          }).encode()

          req = urllib.request.Request(
              "https://api.anthropic.com/v1/messages",
              data=body,
              headers={
                  "content-type": "application/json",
                  "x-api-key": env["ANTHROPIC_API_KEY"],
                  "anthropic-version": "2023-06-01",
              },
          )

          def call_api_with_retry():
              """Appelle l'API avec retry exponentiel sur 429/529 (rate limit / overload)."""
              for attempt in range(MAX_RETRIES):
                  try:
                      with urllib.request.urlopen(req, timeout=120) as resp:
                          return json.load(resp)
                  except urllib.error.HTTPError as e:
                      if e.code in RETRYABLE_STATUS and attempt < MAX_RETRIES - 1:
                          wait = 2 ** attempt * 5  # 5s, 10s, 20s
                          print(f"⚠️ HTTP {e.code} (rate limit/overload), retry dans {wait}s...")
                          time.sleep(wait)
                          continue
                      raise

          try:
              data = call_api_with_retry()
              review = data["content"][0]["text"]
              write_comment(review)
              print("✅ Review générée avec succès")
              set_output("review_success", "true")
          except urllib.error.HTTPError as e:
              err_body = e.read().decode(errors='replace')
              print(f"❌ Erreur API Claude (HTTP {e.code}): {err_body}")
              write_comment(f"⚠️ Erreur lors de l'appel à Claude (HTTP {e.code}). Voir les logs du workflow.")
              set_output("review_success", "false")
          except urllib.error.URLError as e:
              # Erreurs réseau / DNS / SSL — on logge la raison, jamais les headers
              reason = str(e.reason) if hasattr(e, 'reason') else type(e).__name__
              print(f"❌ Erreur réseau : {reason}")
              write_comment("⚠️ Erreur réseau lors de l'appel à Claude. Voir les logs du workflow.")
              set_output("review_success", "false")
          except socket.timeout:
              print("❌ Timeout après 120s — l'API Claude n'a pas répondu")
              write_comment("⚠️ Timeout lors de l'appel à Claude (> 120s).")
              set_output("review_success", "false")
          except Exception as e:
              # On logge uniquement le type pour ne pas risquer de fuiter la clé API
              # (le message d'exception peut contenir les headers de la requête)
              print(f"❌ Erreur inattendue : {type(e).__name__}")
              write_comment("⚠️ Erreur inattendue lors de l'appel à Claude. Voir les logs du workflow.")
              set_output("review_success", "false")
          PYEOF

      # ---- 7. Poster le commentaire sur la PR ----
      - name: Post review comment on PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REVIEW_CONTENT=$(cat /tmp/review_comment.txt)

          # Ajouter le header et footer
          COMMENT=$(cat <<COMMENTEOF
          ## 🤖 Claude Code Review — ${{ steps.branch.outputs.type }}

          | **Langage** | **Framework** | **Fichiers** | **Lignes** |
          |-------------|---------------|--------------|------------|
          | ${{ steps.config.outputs.language }} ${{ steps.config.outputs.version }} | ${{ steps.config.outputs.framework }} | ${{ steps.diff.outputs.files_changed }} | +${{ steps.diff.outputs.additions }} / -${{ steps.diff.outputs.deletions }} |

          ---

          ${REVIEW_CONTENT}

          ---
          <sub>🤖 Review automatique par Claude | Workflow <code>claude-review</code> | <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">Voir le run</a></sub>
          COMMENTEOF
          )

          # Poster via l'API GitHub
          gh pr comment ${{ github.event.pull_request.number }} --body "$COMMENT"
